# ptengine-skills —— GitLab CI
#
# 与 .github/workflows/validate.yml 等价：GitLab 是开发主仓，GitHub（ptxdev/ptengine-skills）
# 是公开镜像（README 里 `/plugin marketplace add` 与 `npx skills add` 的安装地址都指向 GitHub，
# 不能改）。两份 CI 的规则必须保持一致，尤其是最后那条「公开仓禁内部引用/密钥」扫描。
#
# 没有发布 job：skills 不发 npm，版本靠 `npm run release` 打 tag，镜像到 GitHub 后由
# marketplace / skills CLI 直接拉仓库。

stages: [verify]

default:
  image: node:20
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]

validate:
  stage: verify
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  variables:
    # CI 里不装 git hooks
    HUSKY: "0"
  script:
    - node --version && npm --version
    # 用 npm ci 而非 install：package.json 与 lockfile 不一致时必须让 CI 红
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run validate
    # sync 只允许由脚本产出。再跑一次 sync，若产生任何 diff，说明有人手改了副本或忘了同步
    - npm run sync:plugins
    - git add -N .
    - git diff --exit-code || { echo "plugins/*/skills/ is out of sync — run 'npm run sync:plugins' and commit"; exit 1; }
    # 镜像到公开仓：拦住内部主机名 / 内部仓库路径 / 明显的密钥形状
    - |
      if grep -rniE 'ptmind\.com|ptengine-x|jumpserver|BEGIN [A-Z ]*PRIVATE KEY|(secret|token|password|api[_-]?key)[[:space:]]*[:=]' \
           skills/ plugins/ README.md AGENTS.md CONTRIBUTING.md; then
        echo "internal reference or possible secret found — this repo is mirrored to a public repo, remove it"
        exit 1
      fi
