name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 本仓无运行时依赖，devDependency 只有 husky。用 npm ci 而非 install：
      # package.json 与 lockfile 不一致时必须让 CI 红，不能被 install 悄悄兜住。
      - run: npm ci
      - run: npm run validate
      # sync 只允许由脚本产出。CI 里再跑一次 sync，若产生任何 diff，
      # 说明有人绕过 pre-commit 手改了副本或忘了同步。
      - name: ensure plugin copies are committed
        run: |
          npm run sync:plugins
          git add -N .
          if ! git diff --exit-code; then
            echo "::error::plugins/*/skills/ is out of sync — run 'npm run sync:plugins' and commit"
            exit 1
          fi
      # 仓库是 public：拦住把内部主机名 / 内部仓库路径 / 明显的密钥形状误提交进来的 PR。
      - name: scan for internal references and secrets
        run: |
          if grep -rniE 'ptmind\.com|ptengine-x|jumpserver|BEGIN [A-Z ]*PRIVATE KEY|(secret|token|password|api[_-]?key)[[:space:]]*[:=]' \
               skills/ plugins/ README.md AGENTS.md CONTRIBUTING.md; then
            echo "::error::internal reference or possible secret found — this repo is public, remove it"
            exit 1
          fi
          echo "no internal references or obvious secrets found"
